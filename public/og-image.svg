<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="78%" cy="6%" r="70%">
      <stop offset="0%" stop-color="#5bb3d6" stop-opacity="0.30" />
      <stop offset="60%" stop-color="#2f8fb3" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f8fb3" />
      <stop offset="100%" stop-color="#5bb3d6" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0e1b24" />
  <rect width="1200" height="630" fill="url(#glow)" />
  <rect x="0" y="0" width="10" height="630" fill="url(#mark)" />

  <!-- Eyebrow -->
  <text x="80" y="196" fill="#5bb3d6" font-size="25" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" letter-spacing="2">
    TECH LEAD · INDONESIA
  </text>

  <!-- Name -->
  <text x="78" y="300" fill="#e8eef3" font-size="92" font-weight="800" letter-spacing="-3">
    Eric Marcelino
  </text>

  <!-- Tagline -->
  <text x="80" y="378" fill="#9fb2c0" font-size="31">
    Building reliable software across web,
  </text>
  <text x="80" y="422" fill="#9fb2c0" font-size="31">
    mobile, desktop, and IoT.
  </text>

  <!-- Divider -->
  <rect x="80" y="476" width="120" height="3" rx="2" fill="#2f8fb3" />

  <!-- Stack + domain -->
  <text x="80" y="540" fill="#5bb3d6" font-size="25" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" letter-spacing="1">
    Go · Vue.js · Flutter · DevOps
  </text>
  <text x="80" y="582" fill="#6c8493" font-size="23" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">
    ericmarcelinotju.github.io
  </text>

  <!-- Monogram mark -->
  <rect x="905" y="150" width="215" height="215" rx="34" fill="url(#mark)" />
  <text x="1012" y="258" fill="#ffffff" font-size="98" font-weight="800" text-anchor="middle" dominant-baseline="central" letter-spacing="-2">
    EM
  </text>
</svg>
